# Configuración de pnpm (v11 lee los ajustes desde aquí).
# Dependencias autorizadas a ejecutar scripts de build (protección de cadena
# de suministro): solo las estrictamente necesarias.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Overrides de seguridad: versiones parchadas de dependencias transitivas
# hasta que Next actualice sus rangos.
# - sharp <0.35: CVEs de libvips (GHSA-f88m-g3jw-g9cj)
# - postcss <=8.5.11: lectura arbitraria via sourceMappingURL (GHSA-6g55-p6wh-862q)
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.12"
