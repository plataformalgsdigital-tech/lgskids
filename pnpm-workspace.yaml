# Configuración de pnpm (v11 lee los ajustes desde aquí).
# Dependencias autorizadas a ejecutar scripts de build (protección de cadena
# de suministro): solo las estrictamente necesarias.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# sharp <0.35 hereda CVEs de libvips (GHSA-f88m-g3jw-g9cj); Next aún pide
# ^0.34. Forzamos la versión parchada hasta que Next actualice su rango.
overrides:
  sharp: ">=0.35.0"
