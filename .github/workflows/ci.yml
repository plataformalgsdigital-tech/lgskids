name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Lint · Tipos · Pruebas · Arquitectura · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kids
          POSTGRES_PASSWORD: kids_ci
          POSTGRES_DB: kids2026_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kids -d kids2026_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kids:kids_ci@localhost:5432/kids2026_ci
      DIRECT_DATABASE_URL: postgresql://kids:kids_ci@localhost:5432/kids2026_ci
      AUTH_JWT_SECRET: ci-secret-solo-para-pruebas-0123456789abcdef
      SEED_ADMIN_PASSWORD: CiAdminPass123
      INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile

      - name: Migraciones (contra Postgres de CI)
        run: pnpm migrate:deploy

      - name: Seed
        run: pnpm seed

      - name: Lint
        run: pnpm lint

      - name: Revisión de tipos
        run: pnpm typecheck

      - name: Pruebas unitarias e integración
        run: pnpm test

      - name: Pruebas de arquitectura (límites de módulos)
        run: pnpm test:arch

      - name: Formato
        run: pnpm format:check

      - name: Compilación
        run: pnpm build

      - name: Escaneo de dependencias
        run: pnpm audit --prod --audit-level high

  # Los despliegues (staging desde develop, producción desde main con
  # aprobación) se configuran en la Fase 11 junto con las migraciones como
  # paso previo. No se crean recursos pagos sin autorización expresa.
